<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <title>Delicato Café</title>

<meta property="og:title" content="Delicato Café">

<meta property="og:image" content="https://SEU-LINK/imagem.jpg">
<meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      .footer {
  margin-top: 40px;
  text-align: center;
  font-size: 12px;
  color: #777;
  padding-bottom: 20px;
}
    }

    body {
  background: #000;
  color: #fff;

  overflow-x: hidden;
}
.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;

  background: #000;

  margin: 0 auto;
}

    /* BANNER */
.hero {
  width: 100%;
  aspect-ratio: 16 / 9;

  background-image: url("./banner.png");
  background-size: contain;
  background-position: center top;
  background-repeat: no-repeat;

  position: relative;
}
    /* ESCURECER IGUAL AO APP */
    .hero::after {
  content: "";

  position: absolute;
  inset: 0;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 65%,
    rgba(0,0,0,0.75) 85%,
    #000 100%
  );

  pointer-events: none;
}

    .container {
  padding: 20px;
  position: relative;
  z-index: 2;
}

    h1 {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    /* BOTÕES */
    .btn {
      display: block;
      border: 1px solid #666;
      padding: 15px;
      margin: 12px 0;
      border-radius: 40px;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #111;
      border-color: #777;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="hero"></div>

    <div class="container">

      Delivery
    </a>

      Como chegar?

</html>
