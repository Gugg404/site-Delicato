<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicato Café e Açaí</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    /* TOPO COM IMAGEM */
    .hero {
      position: relative;
      height: 250px;
      background: url("image(14).png") center/cover no-repeat;
    }

    /* GRADIENTE ESCURO */
    .hero::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, #000 100%);
    }

    /* CONTEÚDO */
    .container {
      padding: 20px;
      margin-top: -60px;
      text-align: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 25px;
    }

    /* BOTÕES */
    .btn {
      display: block;
      border: 1px solid #444;
      padding: 15px;
      margin: 12px 0;
      border-radius: 30px;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
      background: transparent;
    }

    .btn:hover {
      background: #111;
      border-color: #666;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="hero"></div>

  <div class="container">

    <img src="image(15).png" class="logo">

    <div class="title">DELICATO</div>
    <div class="subtitle">CAFÉ E AÇAÍ</div>

    <a class="btn" href="#">
      Cardápio
    </a>

    <a class="btn" href="https://www.ifood.com.br/delivery/estancia-velha-rs/delicato-cafe-e-acai-centro/b8c9d756-d975-47bf-bdb4-a62c400e7421?utm_medium=share" target="_blank">
      Delivery
    </a>

    <a class="btn" href="https://maps.google.com/?q=Rua Anita Garibaldi, 160 Centro, Estância Velha" target="_blank">
      Como chegar?
    </a>

    <a class="btn" href="https://wa.me/5551994953141" target="_blank">
      Entre em contato
    </a>

    <div class="footer">Desenvolvido por você 😎</div>

  </div>

</body>
</html>
